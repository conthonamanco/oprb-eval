# The five evaluated models. Everything in a table is part of the run fingerprint:
# changing a value invalidates resume for that model (see runner.py).
# Settings are fixed before the full run and are never tuned on the test set.

[tesseract]
adapter = "tesseract"
family = "ocr"
traineddata = "tessdata_best/eng"
psm = 3

[ppocrv5_mobile_en]
adapter = "rapidocr"
family = "ocr"
ocr_version = "PP-OCRv5"
det_model = "mobile"
rec_lang = "en"
rec_model = "mobile"

[doctr_fast_parseq]
adapter = "doctr"
family = "ocr"
det = "fast_base"
rec = "parseq"
assume_straight_pages = false  # pages are rotated by up to 5 degrees

[lightonocr2_1b]
adapter = "lighton"
family = "ocr-vlm"
hf_id = "lightonai/LightOnOCR-2-1B"
revision = "be7c41313c30e940fe5571de59e5fabc779e00c8"
longest_edge = 1540
max_new_tokens = 4096

[qwen3_vl_2b]
adapter = "qwen_vl"
family = "vlm"
hf_id = "Qwen/Qwen3-VL-2B-Instruct"
revision = "89644892e4d85e24eaac8bacfd4f463576704203"
max_pixels = 2097152  # 2048 visual tokens of 32x32 pixels
max_new_tokens = 4096
prompt = "Transcribe all text visible on this document page in natural reading order. Return only the transcription, without introductory text or explanations. Do not describe the page, and do not invent text that you cannot read."
